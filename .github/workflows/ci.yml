name: PR CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies (store)
        working-directory: cerabrasileira-store
        run: yarn install --frozen-lockfile

      - name: Type check (store)
        working-directory: cerabrasileira-store
        run: yarn tsc --noEmit

      - name: Unit tests (store)
        working-directory: cerabrasileira-store
        run: yarn test:unit

      - name: Build (store)
        working-directory: cerabrasileira-store
        run: yarn build

      - name: Install dependencies (storefront)
        working-directory: cerabrasileira-storefront
        run: yarn install --frozen-lockfile

      - name: Lint (storefront)
        working-directory: cerabrasileira-storefront
        run: yarn lint

      - name: Type check (storefront)
        working-directory: cerabrasileira-storefront
        run: yarn tsc --noEmit

      - name: Build (storefront)
        working-directory: cerabrasileira-storefront
        run: yarn build

      - name: Deploy preview
        id: vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: cerabrasileira-storefront
          prod: false

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: cerabrasileira-storefront
        env:
          BASE_URL: ${{ steps.vercel.outputs.preview-url }}
        run: npx playwright test
